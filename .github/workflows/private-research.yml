# Manual acceptance only. Private inputs/outputs stay in the private repository.
# The protected environment must restrict main and require the user's review.
name: Private research manual acceptance
run-name: ${{ inputs.validate_only && 'Public dependencies and synthetic validation' || 'Private research manual acceptance' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicitly approved manual research stage
        type: choice
        options: [initial, update, fallback, close, train]
        required: true
      validate_only:
        description: Only public dependency and synthetic checks; no private access
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: private-research-manual
  cancel-in-progress: false

jobs:
  public-dependency-validation:
    if: github.repository == 'MatokiJZ/ashare-observer-public' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'MatokiJZ' && github.triggering_actor == 'MatokiJZ'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install public dependencies
        run: bash scripts/install_linux_dependencies.sh
      - name: Validate isolated synthetic boundaries
        env:
          ASHARE_MONITOR: '0'
        run: >-
          "$RUNNER_TEMP/ashare-private-python/bin/python" -m pytest -q
          tests/test_linux_dependency_lock.py tests/test_private_cloud_entry.py
          tests/test_private_cloud.py tests/test_cloud_task_migration.py
          tests/test_private_checkpoints.py tests/test_cloud_readback.py
          tests/test_private_runner.py
      - name: State public validation scope
        run: echo 'Public dependencies and synthetic checks only. Private inputs, new research, training and storage are not verified by this job.'

  private-research:
    needs: public-dependency-validation
    if: inputs.validate_only == false && github.repository == 'MatokiJZ/ashare-observer-public' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'MatokiJZ' && github.triggering_actor == 'MatokiJZ'
    environment: private-storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check operation and reviewed commit before any private credential
        env:
          ASHARE_PRIVATE_RUN_APPROVED: ${{ vars.ASHARE_PRIVATE_RUN_APPROVED }}
          ASHARE_ACCEPTANCE_COMMIT: ${{ vars.ASHARE_ACCEPTANCE_COMMIT }}
        run: |
          python - <<'PY'
          import os, re, sys
          sha = os.getenv('GITHUB_SHA', '')
          ready = (os.getenv('ASHARE_PRIVATE_RUN_APPROVED') == '1'
                   and re.fullmatch(r'[a-f0-9]{40}', sha) is not None
                   and os.getenv('ASHARE_ACCEPTANCE_COMMIT') == sha)
          print('Manual authorization verified.' if ready else 'Manual authorization missing; private access blocked.')
          sys.exit(0 if ready else 2)
          PY
      - name: Install public dependencies
        run: bash scripts/install_linux_dependencies.sh
      - name: Create scoped installation token
        id: storage-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.ASHARE_STORAGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ASHARE_STORAGE_APP_PRIVATE_KEY }}
          owner: MatokiJZ
          repositories: ashare-observer
          permission-contents: write
          skip-token-revoke: false
      - name: Run approved private validation with fixed public receipt
        env:
          ASHARE_STORAGE_REPO: MatokiJZ/ashare-observer
          ASHARE_WRITE_BRANCH: migration-acceptance
          ASHARE_STORAGE_TOKEN: ${{ steps.storage-token.outputs.token }}
          ASHARE_PRIVATE_RUN_APPROVED: ${{ vars.ASHARE_PRIVATE_RUN_APPROVED }}
          ASHARE_ACCEPTANCE_COMMIT: ${{ vars.ASHARE_ACCEPTANCE_COMMIT }}
          ASHARE_PROTECTED_ENVIRONMENT: private-storage
          TASK_MODE: ${{ inputs.mode }}
        run: '"$RUNNER_TEMP/ashare-private-python/bin/python" scripts/private_cloud_entry.py'
      - name: State cleanup scope
        if: always()
        run: echo 'The wrapper cleans its isolated private directory. Worker output is discarded; only a fixed receipt is public. The App token action revokes its token in its post step.'
# No automatic schedule or fallback credential. Hash locks and fixed Action
# commits identify reviewed inputs, but cannot prove third-party code is safe.
