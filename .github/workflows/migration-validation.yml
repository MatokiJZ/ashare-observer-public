name: Migration validation (synthetic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASHARE_MONITOR: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Check synthetic storage and failure boundaries
        run: python -m pytest -q tests/test_private_cloud.py tests/test_cloud_task_migration.py
      - name: State validation scope
        run: echo 'Synthetic validation only. Live inputs, private persistence, daily research and weekly training are not verified.'
